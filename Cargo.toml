[package]
name = "moix-cli"
version = "0.0.3"
edition = "2024"
authors = ["Moix Dev <dev@moix.cc>"]
description = "Create a compressed version of index.html with SVG, JavaScript, CSS and Templates."
categories = ["development-tools", "command-line-utilities", "web-programming"]
repository = "https://github.com/moixcc/moix-cli"
readme = "README.md"
license = "MIT"

[[bin]]
name = "moix"
path = "src/main.rs"
doc = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false

[dev-dependencies]
tower = "0.5"

[dependencies]
axum = { version = "0.8", default-features = false, features = [
    "original-uri",
    "tokio",
    "http1",
    "form",
    "multipart",
] }
base64 = { version = "0.23", default-features = false }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls",
] }
rhai = { version = "1.27", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
toml = { version = "1.1", default-features = false, features = [
    "parse",
    "serde",
] }
