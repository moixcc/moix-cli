name: Ubuntu latest

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

  steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Application
        run: |
          cp target/release/moix-cli ./moix-ubuntu
      
      - name: Release 'latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Release
          prerelease: false
          files: moix-ubuntu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
